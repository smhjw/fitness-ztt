<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="FitTrack Records Screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="100" y="90" width="1000" height="80" rx="20" fill="#ffffff"/>
  <rect x="100" y="200" width="1000" height="380" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="140" y="235" width="260" height="36" rx="10" fill="#E6F7F6"/>
  <rect x="430" y="235" width="200" height="36" rx="10" fill="#F3F4F6"/>
  <rect x="140" y="300" width="920" height="70" rx="16" fill="#F8FAFC"/>
  <rect x="140" y="390" width="920" height="70" rx="16" fill="#F8FAFC"/>
  <rect x="140" y="480" width="920" height="70" rx="16" fill="#F8FAFC"/>
  <text x="130" y="140" font-family="Arial, sans-serif" font-size="26" fill="#1F2933">Records</text>
</svg>
