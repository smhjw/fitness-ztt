<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="FitTrack Home Screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#E6F7F6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38B2AC"/>
      <stop offset="100%" stop-color="#2C9B95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F2933" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="140" fill="#38B2AC" opacity="0.15"/>
  <circle cx="190" cy="560" r="180" fill="#6D28D9" opacity="0.12"/>
  <rect x="120" y="110" width="680" height="80" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="120" y="220" width="520" height="40" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="120" y="290" width="420" height="18" rx="9" fill="#CBD5E1"/>
  <rect x="120" y="320" width="320" height="18" rx="9" fill="#CBD5E1"/>
  <g filter="url(#shadow)">
    <rect x="780" y="140" width="300" height="480" rx="40" fill="#111827"/>
    <rect x="800" y="160" width="260" height="440" rx="32" fill="#F5F7FA"/>
    <rect x="820" y="180" width="220" height="110" rx="24" fill="url(#accent)"/>
    <rect x="820" y="310" width="220" height="120" rx="20" fill="#ffffff"/>
    <rect x="820" y="450" width="220" height="120" rx="20" fill="#ffffff"/>
  </g>
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="34" fill="#1F2933">FitTrack</text>
  <text x="140" y="255" font-family="Arial, sans-serif" font-size="22" fill="#475569">Home Dashboard</text>
</svg>
